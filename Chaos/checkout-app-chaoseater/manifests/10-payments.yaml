apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: chaos-lab
  labels:
    app: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: checkout-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: ROLE
              value: payments
            - name: PORT
              value: "8081"
            - name: PAYMENT_DELAY_MS
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: chaos-lab
spec:
  selector:
    app: payments
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
