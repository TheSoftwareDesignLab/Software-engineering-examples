apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chaos-lab
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: checkout-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ROLE
              value: frontend
            - name: PORT
              value: "8080"
            - name: API_URL
              value: http://api.chaos-lab.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chaos-lab
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
