apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: chaos-lab
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: checkout-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ROLE
              value: api
            - name: PORT
              value: "8080"
            - name: PAYMENTS_URL
              value: http://payments.chaos-lab.svc.cluster.local:8081
            - name: PAYMENTS_TIMEOUT_MS
              value: "400"
            - name: PAYMENTS_RETRIES
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: chaos-lab
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
